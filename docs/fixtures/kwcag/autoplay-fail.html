<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>kwcag-autoplay-audio-control / 실패</title>
  </head>
  <body>
    <h1>소리가 자동 재생되고 멈출 수 없는 페이지</h1>

    <!-- 실패: autoplay + 소리 있음(muted 아님) + controls 없음, 페이지에 정지 수단도 없음 -->
    <audio autoplay></audio>

    <p>배경음이 페이지 진입과 동시에 재생되지만 끄는 방법이 없습니다.</p>
  </body>
</html>
