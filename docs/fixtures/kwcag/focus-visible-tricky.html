<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>kwcag-focus-visible / 함정</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }

      /* [통과여야 함] transition 때문에 focus() 직후 computed value가 아직 이전 값이다.
         getAnimations() 예외가 없으면 여기서 대량 오탐이 난다. */
      .delayed {
        transition: box-shadow 0.2s ease;
        box-shadow: none;
      }
      .delayed:focus {
        outline: none;
        box-shadow: 0 0 0 3px #004ac6;
      }

      /* [통과여야 함] 링을 ::after로 그린다. 대상 요소 자체의 스타일은 변하지 않는다. */
      .pseudo-ring {
        position: relative;
      }
      .pseudo-ring:focus {
        outline: none;
      }
      .pseudo-ring:focus::after {
        content: "";
        position: absolute;
        inset: -4px;
        border: 2px solid #004ac6;
      }

      /* [통과여야 함] 링이 부모에 그려진다(:focus-within). 대상만 보면 오탐이 난다. */
      .field {
        display: inline-block;
        padding: 4px;
      }
      .field:focus-within {
        box-shadow: 0 0 0 2px #004ac6;
      }
      .field input:focus {
        outline: none;
      }

      /* [실패여야 함] outline을 그렸지만 색이 투명하다. 값만 비교하면 "달라졌다"로 통과된다. */
      .transparent-ring:focus {
        outline: 2px solid transparent;
      }

      /* [실패여야 함] outline만 지우고 대체 표시가 없다. */
      .stripped:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <h1>포커스 표시 함정 모음</h1>

    <button class="delayed" type="button">transition으로 늦게 뜨는 링</button>

    <button class="pseudo-ring" type="button">::after로 그린 링</button>

    <span class="field">
      <input type="text" aria-label="이름" />
    </span>

    <button class="transparent-ring" type="button">투명한 링</button>

    <button class="stripped" type="button">표시 없음</button>
  </body>
</html>
